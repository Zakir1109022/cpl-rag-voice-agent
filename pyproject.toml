[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cpl-voice-agent"
version = "1.0.0"
description = "Voice-enabled customer support agent for Cpl Phones"
requires-python = ">=3.12"

dependencies = [
    # LiveKit & Voice
    "livekit-agents==1.4.5",
    "livekit-plugins-deepgram==1.4.5",
    "livekit-plugins-inworld==1.4.5",
    "livekit-plugins-langchain==1.4.5",

    # LangChain & LLM
    "langchain",
    "langchain-groq",

    # Vector DB & Embeddings
    "qdrant-client",
    "sentence-transformers",

    # Document Processing
    "docling",

    # Utilities
    "python-dotenv",
    "pydantic-settings",
    "duckduckgo-search>=7.0",

    # Browser automation (Playwright + Chromium)
    "playwright>=1.47",
]

[tool.hatch.build.targets.wheel]
packages = ["langchain_agent", "voice_agent"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
